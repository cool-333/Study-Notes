<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열, 반복문 연습문제</title>
  </head>
  <body>
    <h1>배열, 반복문 연습문제</h1>
    <ol style="line-height: 2">
      <li>
        1부터 20까지의 합을 구하시오.
        <script>
          // 여기에 코드 작성 --> 답 210
          let sum = 0;

          for (let i = 1; i <= 20; i++) {
            sum = sum + i;
          }

          //for (let i = 1; i <= 2; i++) {
          //  sum = sum + i;
          // i : 1, sum : 0 sum + i = 0 + 1 = 1 -> sum = 1
          // i : 2, 1 + 2 = 3 = sum

          // console.log(`i : ${i}, sum : ${sum}`);
          //}
          console.log(sum);
        </script>
      </li>

      <li>
        주어진 배열의 모든 요소를 for문으로 순회하며 합계를 구하시오.
        <script>
          const prices = [5500, 3000, 12000, 8000];
          // 여기에 코드 작성 --> 답 28500
          let add = 0;
          for (let i = 0; i <= 3; i++) {
            add = prices[i] + add;
          }
          console.log(add);
        </script>
      </li>

      <li>
        주어진 배열에서 짝수만 출력하시오.
        <script>
          const numbers = [12, 7, 9, 20, 33, 16];
          // 여기에 코드 작성 --> 답 12, 20, 16

          for (let order = 0; order <= 5; order++) {
            if (numbers[order] % 2 === 0) {
              console.log(numbers[order]);
            }
          }
        </script>
      </li>

      <li>
        주어진 배열에서 가장 큰 값을 찾으시오.
        <script>
          const nums = [3, 45, 21, 99, 18, 77];
          // 여기에 코드 작성 --> 답 99

          let max = 0;

          for (let nnnn = 0; nnnn <= 5; nnnn++) {
            if (max < nums[nnnn]) {
              max = nums[nnnn];
            }
          }

          /*
          if (max < nums[1]) {
            max = nums[1]; // max = 45
          }

          if (max < nums[2]) {
            max = nums[2]
          }*/

          console.log(max);

          /*
          if (nums[0] > nums[1] == true) {
            console.log(nums[0]);
          } else {
            console.log(nums[1]);
          }
          if (nums[1] > nums[2] == true) {
            console.log(nums[1]);
          } else {
            console.log(nums[2]);
          }
          if (nums[2] > nums[3] == true) {
            console.log(nums[2]);
          } else {
            console.log(nums[3]);
          }*/
        </script>
      </li>

      <li>
        배열을 순회하며 홀수 개수를 세시오.
        <script>
          const values = [1, 4, 7, 8, 13, 20, 21];
          // 여기에 코드 작성 --> 답 4개
          let odd = 0;
          for (let oddvalue = 0; oddvalue <= 6; oddvalue++) {
            if (values[oddvalue] % 2 !== 0) {
              odd += 1; //odd = odd + 1
            }
          }
          console.log(odd);
          // if(values[0] % 2 !== 0) {console.log(values[0])}
          // if(values[1] % 2 !== 0) {console.log(values[1])}
        </script>
      </li>

      <li>
        배열의 각 요소를 두 배로 만들어 새 배열에 담으시오. (원본 배열은 그대로
        두고 새 배열을 만들 것)
        <script>
          const original = [1, 2, 3, 4, 5];
          // 여기에 코드 작성
          let arr = [];
          for (let twice = 0; twice <= 4; twice++) {
            arr.push(original[twice] * 2);
          }
          // arr.push(original[0] * 2);
          // arr.push(original[1] * 2);
          console.log(arr);
          // arr[original[0] * 2, original[1] * 2, original[2] * 2, original[3] * 2, original[4] * 2]
        </script>
      </li>

      <li>
        배열에 push로 값을 하나 추가한 뒤, splice로 특정 값을 하나 삭제하시오.
        <script>
          const fruits = ["사과", "바나나", "포도"];
          fruits.push("망고");
          fruits.splice(1, 1);
          console.log(fruits);
        </script>
      </li>
    </ol>
  </body>
</html>
