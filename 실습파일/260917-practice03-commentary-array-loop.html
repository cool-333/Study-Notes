<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열, 반복문 연습문제</title>
  </head>
  <body>
    <h1>배열, 반복문 연습문제</h1>
    <ol style="line-height: 2">
      <li>
        1부터 20까지의 합을 구하시오.
        <script>
          let sum = 0; // 합계를 담을 변수
          for (
            let i = 1;
            i <= 20;
            i++ // i를 1로 두고, i는 20까지 반복되고, i에 1씩 더한다.
          ) {
            sum += i; // --> sum = sum + i; 합계를 담을 변수 sum에 i를 계속 더하는 것을 반복한다.
          }
          console.log(sum); // 1 + 2 + 3 + 4 + ···. + 20 = 210
        </script>
      </li>

      <li>
        주어진 배열의 모든 요소를 for문으로 순회하며 합계를 구하시오.
        <script>
          const prices = [5500, 3000, 12000, 8000];
          for (const price of prices) {
            console.log(price);
          }
        </script>
      </li>

      <li>
        주어진 배열에서 짝수만 출력하시오.
        <script>
          const numbers = [12, 7, 9, 20, 33, 16];
          for (let order = 0; order <= 5; order++) {
            if (numbers[order] % 2 === 0) {
              console.log(numbers[order]);
            }
          }
        </script>
      </li>

      <li>
        주어진 배열에서 가장 큰 값을 찾으시오.
        <script>
          const nums = [3, 45, 21, 99, 18, 77];
          let max = 0;
          for (const num of nums) {
            if (max < num) {
              max = num;
            }
          }
          console.log(max);
          // console.log(Math.max(nums[0], nums[1], nums[2], nums[3], nums[4], nums[5]),) ∴ console.log(Math.max(...nums));
        </script>
      </li>

      <li>
        배열을 순회하며 홀수 개수를 세시오.
        <script>
          const values = [1, 4, 7, 8, 13, 20, 21];
          let odd = 0;
          for (let oddvalue = 0; oddvalue <= 6; oddvalue++) {
            if (values[oddvalue] % 2 !== 0) {
              odd += 1; //odd = odd + 1
            }
          }
          console.log(odd);
        </script>
      </li>

      <li>
        배열의 각 요소를 두 배로 만들어 새 배열에 담으시오. (원본 배열은 그대로
        두고 새 배열을 만들 것)
        <script>
          const original = [1, 2, 3, 4, 5];
          let arr = [];
          for (let twice = 0; twice <= 4; twice++) {
            arr.push(original[twice] * 2);
          }
          console.log(arr);
        </script>
      </li>

      <li>
        배열에 push로 값을 하나 추가한 뒤, splice로 특정 값을 하나 삭제하시오.
        <script>
          const fruits = ["사과", "바나나", "포도"];
          fruits.push("망고");
          fruits.splice(1, 1);
          console.log(fruits);
        </script>
      </li>
    </ol>
  </body>
</html>
